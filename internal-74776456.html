:root{
  --bg:#000000;--ink:#ffffff;--el:#00bcf9;--gold:#f1c421;
  --s1:rgba(255,255,255,.04);--s2:rgba(255,255,255,.08);
  --dim:rgba(255,255,255,.66);--faint:rgba(255,255,255,.55);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.22);
  --cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Micro Hei";
  --head:"League Spartan",var(--cjk),system-ui,sans-serif;
  --body:"Glacial Indifference",var(--cjk),system-ui,sans-serif;
  --barh:49px;--gut:24px;--max:880px;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--el)}
button{font:inherit}
.bar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:var(--max);margin:0 auto;padding:12px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar img{height:24px;width:auto;display:block}
.bar .tag{font-family:var(--head);font-size:13px;letter-spacing:.04em;color:var(--faint)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.intro{padding:48px 0 32px}
h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;letter-spacing:-.02em;margin:0 0 12px}
h2{font-family:var(--head);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.15;margin:0 0 8px}
h3{font-family:var(--head);font-weight:700;font-size:24px;letter-spacing:-.015em;line-height:1.2;margin:0 0 6px}
h4{font-family:var(--head);font-weight:600;font-size:16px;margin:20px 0 8px}
.summary{font-size:17px;color:var(--dim);max-width:640px;margin:0}
.note{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.7;color:var(--dim);max-width:760px}
.note b{display:block;color:var(--ink);font-family:var(--head);font-weight:600;font-size:13.5px;margin-bottom:4px}

/* tabs: xl = underline nav; lg/md/sm = segmented control */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0}
.tab{appearance:none;cursor:pointer;font-family:var(--head);font-weight:600;letter-spacing:-.005em;color:var(--dim);background:none;border:0;border-radius:7px;line-height:1.2;transition:color .15s,background .15s,border-color .15s;display:inline-flex;align-items:baseline;justify-content:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--el);outline-offset:2px}
.tab .ct{font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.tabs.xl{gap:32px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs.xl::-webkit-scrollbar{display:none}
.tabs.xl .tab{font-size:19px;font-weight:700;padding:16px 0 13px;border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--faint)}
.tabs.xl .tab:hover{color:var(--ink)}
.tabs.xl .tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--el)}
.tabs.xl .tab[aria-selected=true] .ct{color:var(--el)}
.tabs.lg,.tabs.md,.tabs.sm{display:inline-flex;padding:4px;background:var(--s2);border:1px solid var(--line);border-radius:10px;max-width:100%}
.tabs.lg .tab{font-size:15px;padding:9px 16px}
.tabs.md .tab{font-size:14px;padding:7px 13px}
.tabs.sm .tab{font-size:13px;padding:6px 11px}
.tabs.lg .tab[aria-selected=true],.tabs.md .tab[aria-selected=true],.tabs.sm .tab[aria-selected=true]{background:var(--ink);color:#000000}

/* cards + facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 22px}
.fact{background:var(--s2);border-radius:10px;padding:16px 18px}
.fact .v{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fact:first-child .v{color:var(--el)}
.fact .l{font-size:13.5px;color:var(--dim);margin-top:6px;line-height:1.4}
.fact .d{font-size:12.5px;color:var(--faint);line-height:1.45;margin-top:3px}
dl.props{display:grid;grid-template-columns:96px 1fr;margin:0 0 20px;font-size:15px}
dl.props dt,dl.props dd{margin:0;padding:10px 0;border-top:1px solid var(--line)}
dl.props dt{color:var(--faint);font-size:13.5px;padding-right:12px;padding-top:11px}
dl.props dd.rw{font-weight:700}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 16px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums lining-nums}
th{font-family:var(--body);font-weight:700;font-size:12.5px;color:var(--faint);text-align:left;padding:10px 16px;background:var(--s2);white-space:nowrap;letter-spacing:.02em;vertical-align:bottom}
td{padding:10px 16px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{white-space:nowrap}
th.r,td.r{text-align:right;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.03)}

ul.bl{margin:8px 0 16px;padding:0;list-style:none}
ul.bl li{position:relative;padding:4px 0 4px 20px;color:var(--dim)}
ul.bl li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--line2)}
.label{font-family:var(--head);font-weight:600;font-size:15px;margin:20px 0 4px}
.btn{appearance:none;cursor:pointer;font-family:var(--head);font-weight:700;font-size:16px;background:transparent;color:var(--ink);border:1px solid var(--line2);padding:12px 20px;border-radius:10px;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--el);color:var(--el)}
.foot{margin:64px 0 0;padding:24px 0 48px;border-top:1px solid var(--line);color:var(--faint);font-size:13.5px;display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.foot .rg{font-family:var(--head);font-weight:700;color:var(--ink);letter-spacing:.02em}
@media (max-width:560px){
  :root{--barh:47px;--gut:16px}
  body{font-size:15.5px}
  .bar img{height:22px}
  .intro{padding:32px 0 24px}
  h1{font-size:32px}
  h2{font-size:26px}
  h3{font-size:21px}
  .summary{font-size:15.5px}
  .tabs.xl{gap:22px}
  .tabs.xl .tab{font-size:17px;padding:14px 0 11px}
  .tabs.lg,.tabs.md{display:flex;width:100%}
  .tabs.lg .tab,.tabs.md .tab{flex:1 1 auto;padding-left:8px;padding-right:8px}
  .facts{grid-template-columns:1fr 1fr;gap:8px}
  .fact{padding:13px 14px}
  .fact:last-child:nth-child(odd){grid-column:1 / -1}
  .fact .v{font-size:24px}
  dl.props{grid-template-columns:76px 1fr;font-size:14.5px}
  table{font-size:13.5px}
  th,td{padding-left:12px;padding-right:12px}
}

:root{--max:1120px}
.toc{position:sticky;top:var(--barh);z-index:15;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 calc(-1 * var(--gut));padding:8px var(--gut)}
.toc::-webkit-scrollbar{display:none}
.toc a{color:var(--dim);text-decoration:none;font-family:var(--head);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;transition:color .15s,background .15s}
.toc a:hover{color:var(--ink)}
.toc a.on{color:#000000;background:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0 0}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.kpi .rk{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--faint)}
.kpi .kv{font-family:var(--head);font-weight:700;font-size:44px;letter-spacing:-.02em;line-height:1.05;margin:10px 0 10px;font-variant-numeric:tabular-nums}
.kpi.top{border-color:rgba(0,188,249,.5)}
.kpi.top .kv{color:var(--el)}
.kpi .kn{font-size:15.5px;font-weight:700;line-height:1.4}
.kpi .kd{font-size:13px;color:var(--faint);margin-top:2px}
.headline{font-size:13.5px;color:var(--faint);margin:12px 0 0}
.aid{display:inline-block;font-size:11px;font-weight:400;color:var(--faint);border:1px solid var(--line2);border-radius:4px;padding:0 5px;line-height:1.55;margin-left:2px;vertical-align:2px;font-variant-numeric:tabular-nums}
.per{font-size:12.5px;color:var(--dim);background:var(--s2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.sec{padding:56px 0 0}
.sec-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sec-top h2{margin:0}
.sec-ctl{display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center}
.ctl{display:flex;align-items:center;gap:10px}
.ctl>span{font-size:12.5px;color:var(--faint);white-space:nowrap}
.cap{color:var(--faint);font-size:14px;margin:-6px 0 16px;max-width:860px}
.sec p{color:var(--dim);max-width:900px}
.sub{margin:28px 0 0}
.sub>h3{font-size:19px}
.grid{display:grid;gap:12px 16px;margin:12px 0 16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fld{display:block}
.fld span{display:block;font-size:12.5px;color:var(--faint);margin-bottom:6px}
.fld input,.fld select{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--s1);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#00bcf9 50%),linear-gradient(135deg,#00bcf9 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.fld input:focus,.fld select:focus{border-color:var(--el)}
.tog{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:12px;background:none;border:0;color:var(--dim);font-family:var(--body);font-size:14.5px;padding:6px 0;margin:8px 0 12px}
.tog i{width:38px;height:22px;border:1px solid var(--line2);border-radius:999px;position:relative;display:inline-block;transition:background .15s,border-color .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:left .15s}
.tog[aria-pressed=true]{color:var(--ink)}
.tog[aria-pressed=true] i{border-color:var(--el);background:var(--el)}
.tog[aria-pressed=true] i::after{left:19px;background:#000000}
.cfgbox{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cfgbox h4{margin-top:4px}
.bars{margin:16px 0 8px}
.brow{display:grid;grid-template-columns:minmax(0,300px) 1fr 96px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.brow .bl1{font-size:14.5px;line-height:1.35}
.brow .bl1 small{display:block;color:var(--faint);font-size:12.5px;margin-top:2px}
.btrack{position:relative;height:12px}
.bfill{position:absolute;top:0;height:12px;border-radius:3px;background:rgba(255,255,255,.30)}
.bfill.em{background:var(--el)}
.bfill.neg{background:transparent;border:1px dashed var(--line2)}
.bzero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line2)}
.bval{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
table.ov td{vertical-align:middle}
table.ov td.heat{position:relative;min-width:160px}
.hb{position:absolute;right:12px;top:50%;transform:translateY(-50%);height:26px;border-radius:5px;background:rgba(255,255,255,.08)}
.hb.neg{background:none;border:1px dashed var(--line2)}
.hv{position:relative;font-weight:700}
tr.gh td{background:var(--s1);font-family:var(--head);font-weight:700;font-size:12.5px;color:var(--dim);letter-spacing:.06em;padding:8px 16px}
tbody tr.gh:hover td{background:var(--s1)}
.pm{display:none}
.dblock .fact:first-child .v{color:var(--ink)}
.dblock .fact:last-child .v{color:var(--el)}
td.sub,th.sub{width:auto}
.rules td:first-child{white-space:nowrap;color:var(--dim);font-size:14px;width:140px}
.detail-tabs{display:grid;gap:14px;margin:4px 0 8px}
.dblock{margin-top:20px;padding:28px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.dblock>h3{font-size:26px}
.mtx-lead{margin:0 0 20px}
.method p{max-width:900px}
@media (max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.brow{grid-template-columns:1fr 84px}.brow .btrack{grid-column:1 / -1;grid-row:2}.kpis{grid-template-columns:1fr}.kpi{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px;padding:16px 18px}.kpi .rk{grid-column:1}.kpi .kv{grid-column:2;grid-row:1 / span 3;font-size:34px;margin:0}.kpi .kn,.kpi .kd{grid-column:1}}
@media (max-width:560px){.g3,.g2{grid-template-columns:1fr 1fr}.sec{padding-top:40px}.dblock{padding:20px 16px;border-radius:14px}.dblock>h3{font-size:22px}.rules td:first-child{width:96px;white-space:normal}.kpi .kv{font-size:28px}.sec-ctl{width:100%}.ctl{width:100%}.ctl .tabs{flex:1}
  table.ov .c-per,table.ov .c-grp{display:none}
  table.ov td:first-child{white-space:normal;min-width:120px}
  .pm{display:block;font-size:12px;color:var(--faint);margin-top:2px}
  table.ov td.heat{min-width:84px}
  table.ov th{white-space:normal;line-height:1.3}
  table.ov th,table.ov td{padding-left:10px;padding-right:10px}
  table.ov td:first-child{min-width:108px}
  table:not(.ov):not(.rules) td{min-width:92px}}

@media (max-width:560px){
  .tabs.fit{flex-wrap:nowrap}
  .tabs.fit .tab{flex:1 1 0;min-width:0;padding-left:4px;padding-right:4px}
  .tab.split{flex-direction:column;align-items:center;gap:2px}

  .tab.split .tl2 i{display:none}
}

@media (max-width:560px){
  table.mt .mh{display:none}
  table.mt td{min-width:0}
  table.mt th,table.mt th.r{white-space:normal;line-height:1.3}
  table.mt th,table.mt td{padding-left:8px;padding-right:8px}
  table.mt td:first-child{white-space:normal}
  table.mt .pm span{display:block}
  table.t13 td:first-child{min-width:6.5em}
  table.cpn td:first-child{min-width:9em}
  table.mt td.r{white-space:normal}
  table.w5 td:first-child,table.t47d td:first-child,table.t47s td:first-child,table.items td:first-child{min-width:0}
  .tabs.md .tab{min-height:44px;align-items:center}

  .detail-tabs .tabs.md::-webkit-scrollbar{display:none}
  .detail-tabs .tabs.md .tab{flex:0 0 auto;min-width:auto;min-height:44px;align-items:center;padding-left:10px;padding-right:10px}
}

    const bonus = cp.map((c) => (dep >= c.min ? Math.min(dep * c.pct, c.cap) : 0));
    const ev = cp.map((c, i) => c.usage * bonus[i]);
    const card = n("cardEx") / n("cardN");
    const gw = [n("gw0"), n("gw1"), n("gw2"), n("gw3")];
    const gT = gw[0] + gw[1] + gw[2] + gw[3];
    const wts = WHEEL.map((_, i) => n("ww" + i));
    const tot = wts.reduce((a, b) => a + b, 0);
    const s0 = (t) => { let sum = 0, g = 0; WHEEL.forEach((it, i) => { const w = wts[i]; const k = it[1]; if (k === "g1") g += w; else if (k === "g2") g += 2 * w; else if (k === "c72") sum += w * ev[2]; else if (k === "c73") sum += w * ev[3]; else sum += w * it[2 + t]; }); return [sum, g]; };
    const base = gw[0] * card + gw[1] * n("rnd");

    const cash = [0, 1, 2].map((t) => WHEEL.reduce((a, it, i) => a + (it[1] === "cash" ? wts[i] * it[2 + t] : 0), 0) / tot);
    return { cp, bonus, ev, card, gacha, wheel, wc, cash, tot, gT };

  h += sec("bars", "净补贴排序", "人均净补贴高端，从高到低，MXN；各活动周期不同，标在标签里，没有换算成统一周期。", barsHtml, ctl("周期", tabs("md", PF_OPTS, pf, "pf", "周期筛选")));
  h += sec("overview", "总览", "", P(changedText) +
    ovTable(ovRows, sortBy !== "group") +
    P("负数＝理论回收大于补贴。净补贴高端按平台杀数（回收较低的一端）算，区间见分活动明细。"),
    ctl("币种", tabs("md", [{ value: "MXN", label: "MXN" }, { value: "USD", label: "USD" }], cur, "cur", "币种")) + ctl("排序", tabs("md", [{ value: "group", label: "按分组" }, { value: "sub", label: "按人均补贴" }, { value: "net", label: "按净补贴" }], sortBy, "sortBy", "排序")));


  h += sec("params", "全局参数", "",
    '<div class="note" style="margin-top:0"><b>口径</b>杀数：平台杀数取 10-13 至 11-11 的 30 天（daily 01_平台汇总_USD），老虎机杀数取 11-09 至 11-11 的 3 天（daily 06a_游戏_USD）；体育杀数 6.5% 是假设值（5%–8% 取中），三天体育投注样本只有 2,634 USD。理论回收给区间：低端按平台杀数，高端按老虎机杀数，体育类只按体育杀数。道具按面值算，是上限估算。口径和 线上活动一览_1113.xlsx 一致，金额是 MXN，1 USD = 17.4245 MXN。</div>' +
    toggle("显示配置参数", "showCfg", showCfg) +
    sub("杀数", "", grid(3, inp("平台 %", "holdP") + inp("老虎机 %", "holdS") + inp("体育 %", "holdSp"))) +
    sub("存款券使用率", "默认是道具表的已使用 ÷ 已发放，显示 1 位小数，计算按原始精度。",
      grid(4, COUPONS.map((c, i) => field(c.tag + "（" + c.id + "）%", "u" + i, in1("u" + i))).join("")) +
      (showCfg ? grid(4, COUPONS.map((c, i) => '<div class="cfgbox"><h4>' + esc(c.tag + "（" + c.id + "）") + '</h4>' + inp("比例 %", "pct" + i) + '<div style="height:10px"></div>' + inp("上限 MXN", "cap" + i) + '<div style="height:10px"></div>' + inp("最低充值 MXN", "min" + i) + '<div style="height:10px"></div>' + inp("打码 倍", "cw" + i) + '</div>').join("")) : "")) +
    sub("玩家充值额", "当前 " + f2(dep) + " MXN，用于首充落档和 4 张存款券。", tabs("md fit", depOpts, s.depMode, "depMode", "玩家充值额") + (s.depMode === "custom" ? '<div style="height:14px"></div>' + grid(3, inp("充值额 MXN", "depCustom")) : "")),
    '<button class="btn" data-act="reset">恢复默认</button>');

  h += sec("detail", "分活动明细", "",
    '<div class="detail-tabs">' + tabs("xl", GROUPS.map((g, gi) => ({ value: String(gi), label: g.name, count: g.acts.length })), String(actGroup), "grp", "活动分组") +
    tabs("md", GROUPS[actGroup].acts.map((a) => ({ value: a.value, label: actLabel(a.value) })), act, "act", "活动") + '</div>' +
    toggle("显示配置参数", "showCfg", showCfg) + block);

  h += sec("coupons", "存款券", "", P("签到券（71871、71894）在 [47] 用 71871 的打码倍数，转盘券（71872、71873）在 [5] 用 71872 的打码倍数。参数在「全局参数 → 存款券使用率」里改。") +
    mtable(["券", "在哪发", "用掉时的奖励（MXN）", "打码", "使用率", "每发一张的期望（MXN）", "每发一张的净补贴（MXN）"], "llrrrrr", COUPONS.map((c, i) => {
      const w = m.cp[i].wager, b = m.bonus[i], e = m.ev[i];
      return [c.tag + "（" + c.id + "）", c.where + "；" + c.games, f2(b), w + " 倍", pc(m.cp[i].usage), f2(e), rng(e - e * w * hS, e - e * w * hP)];
    }), "cpn", [1, 2, 3, 4]));
  h += sec("items", "券与道具对照", "来源：运营中心道具配置，已发放、已使用是累计数。道具打码都是 1 倍。", mtable(["ID", "名称", "是什么", "在哪发", "已发放（次）", "已使用（次）", "使用率"], "llllrrr", DATA.ITEMS.map((r) => [r[0], fmtItem(r[1]), r[2], r[3], r[4], r[5], r[6]]), "items", [2, 3, 4, 5]));
  h += sec("rules", "规则说明", "跨活动的规则；单个活动的规则在分活动明细里。", table(["项目", "规则"], "ll", DATA.RULES, "rules"));
  h += sec("method", "公式", "", '<div class="method">' +
    P("理论回收 = 人均补贴 × 打码倍数 × 杀数；净补贴 = 人均补贴 − 理论回收；回收率 = 打码倍数 × 杀数。理论回收假设玩家把打码打满，只能拿来比较各活动谁更省钱，不是实际成本。") +
    P("存款券每发一张的期望 = 使用率 × MIN(充值额 × 比例, 上限)，充值不到最低额记 0。转盘每转 = Σ(权重 × 面值) ÷ 权重合计，Evento Gacha 按扭蛋单抽期望；扭蛋单抽 = (卡片权重 × 单张卡 + 随机金额权重 × 均值 + 转盘权重 × lucky 每转) ÷ 扭蛋权重合计，两式联立求解。") +
    P("配置来自 11-13 的后台截图转写；[47] 每日奖励按墨西哥时间 11-09 23:12 的系统配置。") + '</div>');
  h += '<footer class="foot"><span>对内资料，不对玩家展示。</span></footer>';

  // 保留输入焦点与光标
  const ae = document.activeElement, fk = ae && ae.dataset ? ae.dataset.k : null, pos = fk && ae.selectionStart;
  document.getElementById("app").innerHTML = h;
  syncToc();
  if (fk) { const el = document.querySelector('input[data-k="' + fk + '"]'); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
document.addEventListener("input", (e) => { const k = e.target.dataset && e.target.dataset.k; if (k && e.target.tagName === "INPUT") { U.s = { ...U.s, [k]: e.target.value }; rerender(); } });
document.addEventListener("change", (e) => {
  const d = e.target.dataset || {};
  if (e.target.tagName === "SELECT" && d.k) { U.s = { ...U.s, [d.k]: e.target.value }; rerender(); }
  if (e.target.tagName === "SELECT" && d.ui) { U[d.ui] = e.target.value; rerender(); }
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "tog") U[v] = !U[v];
  else if (a === "reset") { U.s = { ...DEFAULTS }; U.sport28 = false; }
  else if (a === "grp") U.act = GROUPS[+v].acts[0].value;
  else if (a === "depMode") U.s = { ...U.s, depMode: v };
  else if (["act", "wheelTier", "cur", "sortBy", "pf"].indexOf(a) >= 0) U[a] = v;
  rerender();
});
render();
</script>
</body>
</html>
